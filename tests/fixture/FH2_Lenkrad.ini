; FH2 Lenkrad-Bruecke (inoffiziell) - Einstellungen
; Aenderungen wirken beim naechsten Spielstart.
[Lenkrad]
; 1 = Lenkrad ans Spiel durchreichen, 0 = aus
Aktiv=1
; Teil des Geraetenamens (leer = automatisch, z.B. G920)
Geraet=
; Lenkwinkel in Grad (wie in G HUB eingestellt)
Drehwinkel=180
LenkungUmkehren=0
; Achsen: X Y Z Rx Ry Rz Slider0 Slider1 oder -
AchseLenkung=X
AchseGas=Y
AchseBremse=Rz
AchseKupplung=Slider0
; Tasten-Nummern (0 = erste Taste). Im Log stehen die Nummern gedrueckter Tasten.
TasteA=0
TasteB=1
TasteX=2
TasteY=3
WippeRechts=4
WippeLinks=5
TasteMenu=6
TasteView=7
; H-Schaltung (Driving Force Shifter): 1 = an
Schaltknauf=0
Gang1=12
Gang2=13
Gang3=14
Gang4=15
Gang5=16
Gang6=17
Rueckwaerts=18
RueckwaertsWert=255
; Force Feedback: 1 = an
ForceFeedback=1
; Anschlag = Grad je Seite, ab dem das G920 blockiert (wie im Spiel voll eingeschlagen)
Anschlag=450
; Grundkraefte in Prozent (0 = aus)
Zentrierung=20
Daempfung=6
FFBProtokoll=1
FFBStaerke=75
Vibration=50
KraftNachAussen=30
Glaettung=35
Reibung=4
Mindestkraft=2
; Ausfuehrliches Protokoll in FH2_Lenkrad.log
Log=1
Kurve=30
